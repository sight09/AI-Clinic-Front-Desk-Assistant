<svg width="180" height="180" viewBox="0 0 120 125" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
    @keyframes shadowPulse {
      0%, 100% { transform: scale(1); opacity: 0.2; }
      50% { transform: scale(0.85); opacity: 0.12; }
    }
    .mascot-container {
      animation: float 3s ease-in-out infinite;
      transform-origin: 60px 60px;
    }
    .mascot-blink {
      animation: blink 4s infinite;
      transform-origin: 60px 50px;
    }
    .mascot-heart {
      animation: heartbeat 1.8s ease-in-out infinite;
      transform-origin: 60px 73px;
    }
    .mascot-shadow {
      animation: shadowPulse 3s ease-in-out infinite;
      transform-origin: 60px 115px;
    }
  </style>

  <defs>
    <!-- Gradients -->
    <linearGradient id="mascotBody" x1="20" y1="20" x2="100" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" />
      <stop offset="0.65" stop-color="#edf7f2" />
      <stop offset="1" stop-color="#d5ecdf" />
    </linearGradient>

    <linearGradient id="mascotEarGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#256c54" />
      <stop offset="1" stop-color="#11382b" />
    </linearGradient>

    <linearGradient id="mascotCap" x1="30" y1="12" x2="90" y2="35" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1c5542" />
      <stop offset="1" stop-color="#0f3427" />
    </linearGradient>

    <linearGradient id="heartGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e54867" />
      <stop offset="1" stop-color="#c52848" />
    </linearGradient>

    <radialGradient id="vitalityGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#34d399" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="60" cy="56" r="48" fill="url(#vitalityGlow)" />

  <!-- Shadow Oval -->
  <ellipse cx="60" cy="115" rx="32" ry="4.5" fill="#11382b" class="mascot-shadow" />

  <!-- Floating Mascot Group -->
  <g class="mascot-container">
    <!-- Stethoscope Neck Loop Behind -->
    <path
      d="M 32 64 C 32 88, 88 88, 88 64"
      stroke="#1b4d3c"
      stroke-width="5"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Stethoscope Bell Chest Piece -->
    <circle cx="60" cy="85" r="7" fill="#d49b35" stroke="#ffffff" stroke-width="2" />
    <circle cx="60" cy="85" r="3" fill="#11382b" />

    <!-- Front Desk Headset (Communicator) -->
    <path
      d="M 24 54 C 24 24, 96 24, 96 54"
      stroke="#2b5e4c"
      stroke-width="3.5"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Headset Earcups -->
    <rect x="20" y="44" width="7" height="18" rx="3.5" fill="#11382b" stroke="#ffffff" stroke-width="1.5" />
    <rect x="93" y="44" width="7" height="18" rx="3.5" fill="#11382b" stroke="#ffffff" stroke-width="1.5" />
    <!-- Headset Mic Boom -->
    <path
      d="M 25 56 C 25 74, 44 76, 50 73"
      stroke="#1b4d3c"
      stroke-width="2.5"
      stroke-linecap="round"
      fill="none"
    />
    <circle cx="51" cy="72" r="3" fill="#d49b35" />

    <!-- Mascot Capsule Body & Head -->
    <rect
      x="28"
      y="26"
      width="64"
      height="62"
      rx="30"
      fill="url(#mascotBody)"
      stroke="#b7ddcc"
      stroke-width="2"
    />

    <!-- Clinical Nurse/Doctor Cap -->
    <path
      d="M 38 34 C 44 20, 76 20, 82 34 Z"
      fill="url(#mascotCap)"
      stroke="#11382b"
      stroke-width="1.5"
    />
    <!-- White Medical Cross on Cap -->
    <rect x="58" y="24" width="4" height="10" rx="1.5" fill="#ffffff" />
    <rect x="55" y="27" width="10" height="4" rx="1.5" fill="#ffffff" />

    <!-- Expressive Eyes with Blink Animation -->
    <g class="mascot-blink">
      <!-- Left Eye -->
      <ellipse cx="46" cy="50" rx="4.5" ry="6" fill="#11382b" />
      <circle cx="44.5" cy="48" r="2" fill="#ffffff" />

      <!-- Right Eye -->
      <ellipse cx="74" cy="50" rx="4.5" ry="6" fill="#11382b" />
      <circle cx="72.5" cy="48" r="2" fill="#ffffff" />
    </g>

    <!-- Rosy Cheeks -->
    <ellipse cx="40" cy="56" rx="4" ry="2" fill="#f87171" opacity="0.35" />
    <ellipse cx="80" cy="56" rx="4" ry="2" fill="#f87171" opacity="0.35" />

    <!-- Smiling Mouth -->
    <path
      d="M 54 58 Q 60 64 66 58"
      stroke="#11382b"
      stroke-width="2.2"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Sparkle Stars -->
    <!-- Gold Top-Right Sparkle -->
    <path
      d="M 102 24 L 104 28 L 108 30 L 104 32 L 102 36 L 100 32 L 96 30 L 100 28 Z"
      fill="#d49b35"
    />
    <!-- Emerald Left Sparkle -->
    <path
      d="M 16 38 L 17.5 41 L 20 42.5 L 17.5 44 L 16 47 L 14.5 44 L 12 42.5 L 14.5 41 Z"
      fill="#256c54"
    />

    <!-- Beating Heart Emblem Badge on Chest -->
    <g class="mascot-heart">
      <circle cx="60" cy="73" r="7.5" fill="#ffffff" stroke="#e8f3ee" stroke-width="1.5" />
      <path
        d="M 60 76.5 C 57 74.5 55 72.8 55 71.2 C 55 69.8 56.2 68.8 57.5 68.8 C 58.4 68.8 59.3 69.3 60 70.1 C 60.7 69.3 61.6 68.8 62.5 68.8 C 63.8 68.8 65 69.8 65 71.2 C 65 72.8 63 74.5 60 76.5 Z"
        fill="url(#heartGrad)"
      />
    </g>
  </g>
</svg>
